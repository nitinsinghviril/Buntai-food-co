<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bantai Food Co - Contact</title>
  <style>
    :root { --bg: #fff7ed; --card: #ffffff; --ink: #18181b; --muted: #71717a; --wa: #25d366; --ig: #e1306c; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #18181b; --card: #27272a; --ink: #fafafa; --muted: #a1a1aa; }
    }
    :root[data-theme="dark"] { --bg: #18181b; --card: #27272a; --ink: #fafafa; --muted: #a1a1aa; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
    main { width: 100%; max-width: 380px; background: var(--card); border-radius: 24px; padding: 28px 20px; text-align: center; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
    .logo { width: 64px; height: 64px; border-radius: 16px; background: #f97316; color: #fff; font-weight: 800; font-size: 28px; line-height: 64px; margin: 0 auto 12px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
    a.btn { display: block; text-decoration: none; color: #fff; font-weight: 700; padding: 14px; border-radius: 999px; margin-bottom: 12px; }
    a.wa { background: var(--wa); }
    a.ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
  </style>
</head>
<body>
  <main>
    <div class="logo">B</div>
    <h1>Bantai Food Co</h1>
    <p>Chat with us or follow us</p>
    <a class="btn wa" href="https://wa.me/qr/KVNAGR53TGCSB1" target="_blank" rel="noopener">WhatsApp</a>
    <a class="btn ig" href="https://www.instagram.com/buntaifoodco/" target="_blank" rel="noopener">Instagram @buntaifoodco</a>
  </main>
</body>
</html>
