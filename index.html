<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS & Inventory System</title>
    <!-- Tailwind CSS CDN for lightweight UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <!-- Defer loading scripts so HTML renders instantly -->
    <script src="qr-engine.js" defer></script>
    <script src="inventory.js" defer></script>
    <script src="purchase-list.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body class="bg-amber-50 text-slate-800 min-h-screen">

    <!-- Header Navigation -->
    <header class="bg-orange-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">Smart POS System</h1>
        <div class="space-x-2">
            <button onclick="switchTab('pos')" class="px-3 py-1 bg-orange-700 hover:bg-orange-800 rounded">POS</button>
            <button onclick="switchTab('inventory')" class="px-3 py-1 bg-orange-700 hover:bg-orange-800 rounded">Inventory</button>
            <button onclick="switchTab('purchase')" class="px-3 py-1 bg-orange-700 hover:bg-orange-800 rounded">Purchase List</button>
        </div>
    </header>

    <main class="p-6 max-w-6xl mx-auto">
        <!-- POS Section -->
        <section id="sec-pos" class="tab-content">
            <h2 class="text-2xl font-bold mb-4">Point of Sale</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Product List -->
                <div class="bg-white p-4 rounded shadow">
                    <h3 class="font-semibold text-lg mb-2">Select Products</h3>
                    <div id="pos-product-list" class="space-y-2"></div>
                </div>
                <!-- Cart & QR -->
                <div class="bg-white p-4 rounded shadow">
                    <h3 class="font-semibold text-lg mb-2">Current Order</h3>
                    <div id="cart-items" class="min-h-[100px] border-b pb-2 mb-2 text-sm text-gray-600">No items selected</div>
                    <div class="text-right font-bold text-lg mb-4">Total: ₹<span id="cart-total">0.00</span></div>
                    <button onclick="generatePaymentQR()" class="w-full bg-emerald-600 text-white py-2 rounded font-semibold hover:bg-emerald-700 mb-4">Generate Payment QR</button>
                    <div id="qr-container" class="flex justify-center my-2"></div>
                </div>
            </div>
        </section>

        <!-- Inventory Section -->
        <section id="sec-inventory" class="tab-content hidden">
            <h2 class="text-2xl font-bold mb-4">Stock Management</h2>
            <div class="bg-white p-4 rounded shadow overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b bg-amber-100">
                            <th class="p-2">Item</th>
                            <th class="p-2">Stock</th>
                            <th class="p-2">Min Threshold</th>
                            <th class="p-2">Unit Cost (₹)</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-table-body"></tbody>
                </table>
            </div>
        </section>

        <!-- Purchase List Section -->
        <section id="sec-purchase" class="tab-content hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold">Purchase Reorder List</h2>
                <button onclick="PurchaseModule.generateList()" class="bg-orange-600 text-white px-4 py-2 rounded hover:bg-orange-700 font-semibold">Refresh Purchase List</button>
            </div>
            <div class="bg-white p-4 rounded shadow">
                <div id="purchase-list-container">
                    <p class="text-gray-500">Click "Refresh Purchase List" to scan inventory levels.</p>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
