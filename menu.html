<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bantai Food Co - Menu</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #fff3dc; color: #1f1f1f; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    body { padding: 10px; min-height: 100%; }
    header { text-align: center; padding: 4px 0 10px; }
    header h1 { margin: 0; font-size: clamp(22px, 6vw, 30px); font-weight: 900; color: #dc2626; letter-spacing: .02em; }
    header p { margin: 2px 0 0; font-size: 13px; font-weight: 700; color: #7c2d12; letter-spacing: .12em; text-transform: uppercase; }
    section { background: #fffaf0; border: 2px solid #fed7aa; border-radius: 16px; padding: 8px; margin-bottom: 10px; }
    .head { display: inline-block; color: #fff; font-weight: 900; font-size: 14px; text-transform: uppercase; letter-spacing: .05em; padding: 6px 14px; border-radius: 10px; margin-bottom: 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 6px 8px; }
    .card { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 12px; padding: 6px; min-width: 0; }
    .photo { flex: 0 0 auto; width: 58px; height: 58px; border-radius: 50%; overflow: hidden; background: #fde7c7; display: flex; align-items: center; justify-content: center; font-size: 28px; }
    .photo img, .photo svg { width: 100%; height: 100%; }
    .photo img { object-fit: cover; }
    .text { min-width: 0; flex: 1; }
    .name { font-size: 13px; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
    .meta { font-size: 10px; color: #78716c; line-height: 1.3; }
    .price { font-size: 20px; font-weight: 900; color: #dc2626; line-height: 1.1; white-space: nowrap; }
    .empty { text-align: center; color: #78716c; padding: 40px 0; }
  </style>
</head>
<body>
  <header>
    <h1>Bantai Food Co</h1>
    <p>Menu</p>
  </header>
  <main id="list"><div class="empty">Loading menu…</div></main>
<script>
  const COLORS = ["#dc2626", "#ea580c", "#0e7490", "#7e22ce", "#15803d", "#be185d"];
  const money = (n) => "₹" + Number(n || 0).toLocaleString("en-IN");

  // Momo shapes drawn from the photos: steamed = round pleated ball, fried = golden crescent.
  const STEAM = '<svg viewBox="0 0 64 64"><ellipse cx="32" cy="38" rx="22" ry="17" fill="#fffdf7" stroke="#a16207" stroke-width="2"/><path d="M28 22 Q32 12 36 22" fill="none" stroke="#a16207" stroke-width="2"/><path d="M22 30 q4 6 0 12M32 26 q4 8 0 16M42 30 q-4 6 0 12" fill="none" stroke="#c9a86a" stroke-width="1.6" stroke-linecap="round"/>__DOTS__</svg>';
  const FRIED = '<svg viewBox="0 0 64 64"><path d="M8 44 Q10 16 34 14 Q56 14 54 42 Q32 36 8 44 Z" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><path d="M16 40 l4 -4 l4 4 l4 -4 l4 4 l4 -4 l4 4 l4 -4" fill="none" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>__DOTS__</svg>';
  const RED = '<circle cx="24" cy="32" r="2.2" fill="#dc2626"/><circle cx="36" cy="28" r="2.2" fill="#dc2626"/><circle cx="32" cy="40" r="2.2" fill="#dc2626"/><circle cx="44" cy="36" r="2.2" fill="#dc2626"/><circle cx="20" cy="42" r="2" fill="#dc2626"/>';
  const YELLOW = '<circle cx="24" cy="32" r="2.2" fill="#facc15"/><circle cx="36" cy="28" r="2.2" fill="#facc15"/><circle cx="32" cy="40" r="2.2" fill="#facc15"/><circle cx="44" cy="36" r="2.2" fill="#facc15"/>';
  const CATEGORY_ICON = { "Burgers": "🍔", "Drinks": "🥤", "Makhana": "🌰", "Bhel": "🥗", "Specials": "⭐", "Rice & Snacks": "🥣" };

  function iconFor(i) {
    const n = i.name || "";
    const cat = i.category || "";
    if (/fried|fry/i.test(n) || /fried/i.test(cat)) {
      return FRIED.replace("__DOTS__", /peri/i.test(n) ? RED : /corn/i.test(n) ? YELLOW : "");
    }
    if (/momo|steam/i.test(n) || /momo/i.test(cat)) {
      return STEAM.replace("__DOTS__", /peri/i.test(n) ? RED : /corn/i.test(n) ? YELLOW : "");
    }
    return i.icon || CATEGORY_ICON[cat] || "🍽️";
  }

  function card(i) {
    const c = document.createElement("div");
    c.className = "card";
    const photo = document.createElement("div");
    photo.className = "photo";
    if (i.image) {
      const img = document.createElement("img");
      img.alt = i.name;
      img.loading = "lazy";
      img.src = i.image;
      img.onerror = () => { photo.innerHTML = iconFor(i); };
      photo.append(img);
    } else {
      photo.innerHTML = iconFor(i);
    }
    const text = document.createElement("div");
    text.className = "text";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = i.name;
    text.append(name);
    if (i.pieces || i.unit) {
      const m = document.createElement("div");
      m.className = "meta";
      m.textContent = (i.pieces ? i.pieces + " " + (i.unit || "pcs") : "");
      if (m.textContent) text.append(m);
    }
    if (i.description) {
      const d = document.createElement("div");
      d.className = "meta";
      d.textContent = i.description;
      text.append(d);
    }
    const price = document.createElement("div");
    price.className = "price";
    price.textContent = money(i.price);
    c.append(photo, text, price);
    return c;
  }

  function render(data) {
    const list = document.getElementById("list");
    list.innerHTML = "";
    const listed = (data.categories || []).map((c) => String(c).trim());
    const extra = [...new Set(data.items.map((i) => String(i.category || "").trim()))].filter((c) => c && !listed.includes(c));
    const order = [...listed, ...extra];
    let n = 0;
    order.forEach((cat) => {
      const group = data.items.filter((i) => i.category === cat).sort((a, b) => a.name.localeCompare(b.name));
      if (!group.length) return;
      const color = COLORS[n++ % COLORS.length];
      const sec = document.createElement("section");
      const head = document.createElement("div");
      head.className = "head";
      head.style.background = color;
      head.textContent = cat;
      const grid = document.createElement("div");
      grid.className = "grid";
      group.forEach((i) => grid.append(card(i)));
      sec.append(head, grid);
      list.append(sec);
    });
    if (!list.children.length) list.innerHTML = '<div class="empty">No items yet</div>';
  }

  let fromPos = false;
  window.addEventListener("message", (e) => {
    if (e.data && e.data.type === "menu") { fromPos = true; render(e.data.data); }
  });
  fetch("menu.json", { cache: "no-cache" })
    .then((r) => r.json())
    .then((d) => { if (!fromPos) render(d); })
    .catch(() => {
      if (!fromPos) document.getElementById("list").innerHTML = '<div class="empty">Menu could not be loaded</div>';
    });
</script>
</body>
</html>
