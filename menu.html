<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bantai Food Co - Menu</title>
  <style>
    :root { --bg: #fff7ed; --card: #ffffff; --ink: #18181b; --muted: #71717a; --accent: #ea580c; --line: #fed7aa; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #18181b; --card: #27272a; --ink: #fafafa; --muted: #a1a1aa; --line: #3f3f46; }
    }
    :root[data-theme="dark"] { --bg: #18181b; --card: #27272a; --ink: #fafafa; --muted: #a1a1aa; --line: #3f3f46; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; padding: 8px; }
    header { text-align: center; font-weight: 800; font-size: clamp(15px, 4vw, 18px); padding: 2px 0 6px; }
    header span { color: var(--accent); }
    main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .tile { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px; min-width: 0; overflow: hidden; }
    .photo { flex: 0 0 auto; width: 48px; height: 48px; border-radius: 10px; background: var(--line); display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--accent); overflow: hidden; }
    .photo img { width: 100%; height: 100%; object-fit: cover; }
    .text { min-width: 0; flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .name { font-weight: 700; font-size: clamp(11px, 3vw, 13px); line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cat { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .04em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .price { font-weight: 800; font-size: clamp(16px, 5vw, 22px); color: var(--accent); line-height: 1.1; white-space: nowrap; }
    .empty { grid-column: 1 / -1; align-self: center; text-align: center; color: var(--muted); }
  </style>
</head>
<body>
  <header>Bantai Food Co <span>Menu</span></header>
  <main id="list"><div class="empty">Loading menu…</div></main>
<script>
  const money = (n) => "₹" + Number(n || 0).toLocaleString("en-IN");

  function tile(i) {
    const t = document.createElement("div");
    t.className = "tile";
    const photo = document.createElement("div");
    photo.className = "photo";
    if (i.image) {
      const img = document.createElement("img");
      img.alt = i.name;
      img.loading = "lazy";
      img.src = i.image;
      img.onerror = () => { photo.textContent = i.name.charAt(0); };
      photo.append(img);
    } else {
      photo.textContent = i.name.charAt(0);
    }
    const text = document.createElement("div");
    text.className = "text";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = i.name;
    const cat = document.createElement("div");
    cat.className = "cat";
    cat.textContent = i.category + (i.pieces ? " · " + i.pieces + " " + (i.unit || "pcs") : "");
    text.append(name, cat);
    const price = document.createElement("div");
    price.className = "price";
    price.textContent = money(i.price);
    t.append(photo, text, price);
    return t;
  }

  function render(data) {
    const list = document.getElementById("list");
    const order = data.categories && data.categories.length ? data.categories : [...new Set(data.items.map((i) => i.category))];
    const items = [];
    order.forEach((cat) => {
      data.items.filter((i) => i.category === cat)
        .sort((a, b) => a.name.localeCompare(b.name))
        .forEach((i) => items.push(i));
    });
    list.innerHTML = "";
    if (!items.length) { list.innerHTML = '<div class="empty">No items yet</div>'; return; }
    const rows = Math.ceil(items.length / 2);
    list.style.gridTemplateRows = "repeat(" + rows + ", 1fr)";
    items.forEach((i) => list.append(tile(i)));
  }

  fetch("menu.json", { cache: "no-cache" })
    .then((r) => r.json())
    .then(render)
    .catch(() => {
      document.getElementById("list").innerHTML = '<div class="empty">Menu could not be loaded</div>';
    });
</script>
</body>
</html>
