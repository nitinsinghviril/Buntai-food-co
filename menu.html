<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bantai Food Co - Menu</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #fff3dc; color: #1f1f1f; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    body { padding: 10px; }
    header { text-align: center; padding: 4px 0 10px; }
    header h1 { margin: 0; font-size: clamp(22px, 6vw, 30px); font-weight: 900; color: #dc2626; letter-spacing: .02em; }
    header p { margin: 2px 0 0; font-size: 13px; font-weight: 700; color: #7c2d12; letter-spacing: .12em; text-transform: uppercase; }
    section { background: #fffaf0; border: 2px solid #fed7aa; border-radius: 16px; padding: 8px; margin-bottom: 10px; }
    .head { display: inline-block; color: #fff; font-weight: 900; font-size: 14px; text-transform: uppercase; letter-spacing: .05em; padding: 6px 14px; border-radius: 10px; margin-bottom: 8px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; }
    .card { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 12px; padding: 6px; min-width: 0; }
    .photo { flex: 0 0 auto; width: 58px; height: 58px; border-radius: 50%; overflow: hidden; background: #fde7c7; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 20px; color: #c2410c; }
    .photo img { width: 100%; height: 100%; object-fit: cover; }
    .text { min-width: 0; flex: 1; }
    .name { font-size: 13px; font-weight: 800; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta { font-size: 10px; color: #78716c; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .price { font-size: 20px; font-weight: 900; color: #dc2626; line-height: 1.1; white-space: nowrap; }
    .empty { text-align: center; color: #78716c; padding: 40px 0; }
  </style>
</head>
<body>
  <header>
    <h1>Bantai Food Co</h1>
    <p>Menu</p>
  </header>
  <main id="list"><div class="empty">Loading menu…</div></main>
<script>
  const COLORS = ["#dc2626", "#ea580c", "#0e7490", "#7e22ce", "#15803d", "#be185d"];
  const money = (n) => "₹" + Number(n || 0).toLocaleString("en-IN");

  function card(i) {
    const c = document.createElement("div");
    c.className = "card";
    const photo = document.createElement("div");
    photo.className = "photo";
    if (i.image) {
      const img = document.createElement("img");
      img.alt = i.name;
      img.loading = "lazy";
      img.src = i.image;
      img.onerror = () => { photo.textContent = i.name.charAt(0); };
      photo.append(img);
    } else {
      photo.textContent = i.name.charAt(0);
    }
    const text = document.createElement("div");
    text.className = "text";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = i.name;
    text.append(name);
    if (i.pieces) {
      const m = document.createElement("div");
      m.className = "meta";
      m.textContent = i.pieces + " " + (i.unit || "pcs");
      text.append(m);
    }
    if (i.description) {
      const d = document.createElement("div");
      d.className = "meta";
      d.textContent = i.description;
      text.append(d);
    }
    const price = document.createElement("div");
    price.className = "price";
    price.textContent = money(i.price);
    c.append(photo, text, price);
    return c;
  }

  function render(data) {
    const list = document.getElementById("list");
    list.innerHTML = "";
    const order = data.categories && data.categories.length ? data.categories : [...new Set(data.items.map((i) => i.category))];
    let n = 0;
    order.forEach((cat) => {
      const group = data.items.filter((i) => i.category === cat).sort((a, b) => a.name.localeCompare(b.name));
      if (!group.length) return;
      const color = COLORS[n++ % COLORS.length];
      const sec = document.createElement("section");
      const head = document.createElement("div");
      head.className = "head";
      head.style.background = color;
      head.textContent = cat;
      const grid = document.createElement("div");
      grid.className = "grid";
      group.forEach((i) => grid.append(card(i)));
      sec.append(head, grid);
      list.append(sec);
    });
    if (!list.children.length) list.innerHTML = '<div class="empty">No items yet</div>';
  }

  fetch("menu.json", { cache: "no-cache" })
    .then((r) => r.json())
    .then(render)
    .catch(() => {
      document.getElementById("list").innerHTML = '<div class="empty">Menu could not be loaded</div>';
    });
</script>
</body>
</html>
